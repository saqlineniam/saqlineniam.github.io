    <script>
      // Dark mode is the default; a saved "light" choice from the toggle overrides it.
      // Runs before first paint so the page never flashes.
      (function () {
        var light = false;
        try { light = localStorage.getItem('theme') === 'light'; } catch (e) {}
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafafa');
        else document.documentElement.classList.add('dark');
      })();
